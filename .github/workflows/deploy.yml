name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oracle
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SSH key
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          test -n "$ORACLE_SSH_KEY"
          test -n "$ORACLE_HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle
          chmod 600 ~/.ssh/oracle
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Install Cloudflare origin certificate
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          CLOUDFLARE_ORIGIN_CERT: ${{ secrets.CLOUDFLARE_ORIGIN_CERT }}
          CLOUDFLARE_ORIGIN_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_KEY }}
        run: |
          test -n "$CLOUDFLARE_ORIGIN_CERT"
          test -n "$CLOUDFLARE_ORIGIN_KEY"
          printf '%s\n' "$CLOUDFLARE_ORIGIN_CERT" > /tmp/igrec-origin.pem
          printf '%s\n' "$CLOUDFLARE_ORIGIN_KEY" > /tmp/igrec-origin.key
          chmod 600 /tmp/igrec-origin.pem /tmp/igrec-origin.key
          scp -i ~/.ssh/oracle /tmp/igrec-origin.pem "${ORACLE_USER:-ubuntu}@${ORACLE_HOST}:/tmp/igrec-origin.pem"
          scp -i ~/.ssh/oracle /tmp/igrec-origin.key "${ORACLE_USER:-ubuntu}@${ORACLE_HOST}:/tmp/igrec-origin.key"
          ssh -i ~/.ssh/oracle "${ORACLE_USER:-ubuntu}@${ORACLE_HOST}" <<'REMOTE'
          set -euo pipefail
          sudo install -d -m 0750 -o root -g www-data /etc/ssl/cloudflare
          sudo install -m 0640 -o root -g www-data /tmp/igrec-origin.pem /etc/ssl/cloudflare/igrec.net.pem
          sudo install -m 0640 -o root -g www-data /tmp/igrec-origin.key /etc/ssl/cloudflare/igrec.net.key
          rm -f /tmp/igrec-origin.pem /tmp/igrec-origin.key
          REMOTE

      - name: Upload source
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          tar --exclude='.git' --exclude='data' --exclude='*.db' -czf /tmp/igrec-deploy.tgz .
          scp -i ~/.ssh/oracle /tmp/igrec-deploy.tgz "${ORACLE_USER:-ubuntu}@${ORACLE_HOST}:/tmp/igrec-deploy.tgz"

      - name: Build and restart service
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh -i ~/.ssh/oracle "${ORACLE_USER:-ubuntu}@${ORACLE_HOST}" <<'REMOTE'
          set -euo pipefail
          sudo mkdir -p /opt/igrec/src /opt/igrec/bin /opt/igrec/data
          sudo find /opt/igrec/src -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          sudo tar -xzf /tmp/igrec-deploy.tgz -C /opt/igrec/src
          sudo chown -R "$USER:$USER" /opt/igrec/src
          cd /opt/igrec/src
          go test ./...
          CGO_ENABLED=1 go build -o /tmp/igrec-bin ./cmd/igrec
          if sudo test -x /opt/igrec/bin/igrec; then
            sudo cp /opt/igrec/bin/igrec /opt/igrec/bin/igrec.previous
          fi
          if sudo test -f /etc/nginx/sites-available/igrec.net; then
            sudo cp /etc/nginx/sites-available/igrec.net /etc/nginx/sites-available/igrec.net.previous
          fi
          rollback_deploy() {
            status=$?
            trap - ERR
            if sudo test -f /etc/nginx/sites-available/igrec.net.previous; then
              echo "Deploy failed; restoring previous nginx site"
              sudo cp /etc/nginx/sites-available/igrec.net.previous /etc/nginx/sites-available/igrec.net
              sudo nginx -t && sudo systemctl reload nginx || true
            fi
            if sudo test -x /opt/igrec/bin/igrec.previous; then
              echo "Deploy failed; restoring previous igrec binary"
              sudo cp /opt/igrec/bin/igrec.previous /opt/igrec/bin/igrec
              sudo chown igrec:igrec /opt/igrec/bin/igrec
              sudo chmod 755 /opt/igrec/bin/igrec
              sudo systemctl restart igrec || true
            fi
            exit "$status"
          }
          trap rollback_deploy ERR
          sudo mv /tmp/igrec-bin /opt/igrec/bin/igrec
          sudo chown -R igrec:igrec /opt/igrec
          sudo chmod 755 /opt/igrec/bin/igrec
          sudo cp deploy/systemd/igrec.service /etc/systemd/system/igrec.service
          sudo cp deploy/systemd/igrec-daily-email.service /etc/systemd/system/igrec-daily-email.service
          sudo cp deploy/systemd/igrec-daily-email.timer /etc/systemd/system/igrec-daily-email.timer
          sudo cp deploy/nginx/igrec.net /etc/nginx/sites-available/igrec.net
          sudo ln -sf /etc/nginx/sites-available/igrec.net /etc/nginx/sites-enabled/igrec.net
          sudo systemctl daemon-reload
          sudo nginx -t
          sudo systemctl reload nginx
          sudo systemctl enable --now igrec-daily-email.timer
          sudo systemctl restart igrec
          systemctl is-active igrec
          curl -fsS -H 'Host: igrec.net' http://127.0.0.1/healthz
          curl -fsSk -H 'Host: igrec.net' https://127.0.0.1/healthz
          curl -fsS -H 'Host: igrec.net' http://127.0.0.1/ >/dev/null
          trap - ERR
          REMOTE
